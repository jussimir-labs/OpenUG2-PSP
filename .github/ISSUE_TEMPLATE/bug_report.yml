name: Report a bug (English)
description: Found a problem in the beta? Share your steps and evidence.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "One problem per report. Photos or video help. L + R + SELECT writes a technical file, not a screenshot. Read the illustrated guide at docs/bug-reporting-guide-EN.pdf."
  - type: input
    id: version
    attributes:
      label: Beta version
      description: Copy the package name you received. No hash calculation needed.
      placeholder: NFSU2-PSP-beta01-gerador-4u.zip
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where did you play?
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go
        - PPSSPP
        - Other / I don't know
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Game source
      options:
        - US Xbox (NTSC-U)
        - US PS2 (NTSC-U)
        - I don't know
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Mode, track or screen, and car
      placeholder: Quick Race / Circuit / Freemont / Peugeot 206
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: Describe what you saw. You do not need to find the cause.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: How should it work?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we repeat it?
      description: List the steps in order, starting from launching the game.
      value: |
        1. Launched the game from the XMB.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often did it happen?
      options:
        - Every time I tried
        - Sometimes
        - Once / I did not repeat it
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Drag JPG/PNG photos, a short video and the ZIP of bug-N.n2bug here. Wait for uploads to finish. If no technical file was created, say so.
  - type: textarea
    id: environment
    attributes:
      label: Additional information
      description: Firmware/CFW, card and settings, if known. It is fine to say you don't know.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for similar reports and checked the known limitations.
          required: true
        - label: This report describes one problem.
          required: true
