name: Native browser generator
on:
  workflow_dispatch:
  push:
    branches: [codex/native-generator]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar curl diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja perl
      - name: Cached native tools
        uses: actions/cache@v4
        id: tools
        with:
          path: native/tools
          key: native-tools-${{ matrix.target }}-${{ hashFiles('native/build_tools.sh', 'native/utf8.manifest') }}
      - name: Build native tools (Windows)
        if: runner.os == 'Windows' && steps.tools.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash native/build_tools.sh native/tools native/.cache/tools
      - name: Build native tools (macOS)
        if: runner.os == 'macOS' && steps.tools.outputs.cache-hit != 'true'
        run: bash native/build_tools.sh native/tools native/.cache/tools
      - name: Save compiled native tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Native Rust tests and release build
        run: |
          cargo test --locked --manifest-path native/Cargo.toml
          cargo build --locked --release --manifest-path native/Cargo.toml
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $env:CC = "C:\msys64\mingw64\bin\gcc.exe"
          python native/build_bundle.py --output native/dist/NFSU2-Generator-${{ matrix.target }} --tools native/tools --helper native/target/release/nfsu2-generator.exe
      - name: Package macOS
        if: runner.os == 'macOS'
        run: python native/build_bundle.py --output native/dist/NFSU2-Generator-${{ matrix.target }} --tools native/tools --helper native/target/release/nfsu2-generator
      - name: Test isolated package and archive
        run: python native/test_bundle.py native/dist/NFSU2-Generator-${{ matrix.target }} --archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NFSU2-Generator-${{ matrix.target }}
          path: |
            native/dist/*.zip
            native/dist/*.sha256
            native/dist/*/native-qa.json
          if-no-files-found: warn
          retention-days: 14
