name: Release content policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inspection dependency
        run: python -m pip install -r native/release-requirements.txt
      - name: Verify release content regression tests
        run: python -m unittest discover -s native/tests -v
      - name: Check current public sources
        run: python native/release_guard.py native tools sources web docs tests art presets manifests third_party licenses psp-viewer *.py *.md VERSION requirements.txt eboot/release.json
