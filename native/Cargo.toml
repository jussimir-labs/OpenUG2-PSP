[package]
name = "nfsu2-generator"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = "3.4"
# HTTPS with rustls and the bundled Mozilla roots: no system TLS library.
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over D-Bus in pure Rust (libsecret's protocol, no libdbus).
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[profile.release]
strip = true
